projects:
  heading: Selected Academic Projects
  order: 5
  items:
    - title: "Cosmological Initial Conditions: CMB Power Spectra and the Zel'dovich Approximation"
      org: "PHYS 7127: Cosmology & Galaxies, Georgia Institute of Technology"
      detail: "Computational term project · Instructor: John Wise"
      date: Fall 2025
      bullets:
        - "Used the Boltzmann solver CAMB with Planck 2018 parameters to compute CMB temperature and linear matter power spectra, located the first acoustic peak (ℓ ≈ 220) and compared its scale with the sound horizon at last scattering, and studied the effects of baryon fraction, curvature, low dark-matter density, early reionization and massive neutrinos."
        - "Wrote Python code to generate cosmological initial conditions at z = 99 in a (20 comoving Mpc)³, 64³ volume: Gaussian random density fields sampled from the CAMB matter power spectrum with FFTs, and Zel'dovich dark-matter particle displacements and velocities, for Planck 2018 and open (ΩΛ = 0) cosmologies."
    - title: Photometric Analysis of the Eclipsing Binary GALEX J19444+5459
      org: ASTR 302, University of Arizona
      detail: "Collaborators: R. Basant and A. Olson"
      date: December 2022
      bullets:
        - Obtained V-band observations with the Kuiper 61-inch telescope and reduced the imaging data using IRAF, including noise and cosmic-ray correction and photometry.
        - Constructed light curves, determined the orbital period and primary and secondary eclipse depths, and estimated component radii for the brown dwarf and subdwarf B star.
    - title: Numerical Solution of the Two-Dimensional Schrödinger Equation
      org: PHYS 305, University of Arizona
      date: May 2023
      bullets:
        - Applied finite-difference methods and eigenvalue calculations to solve the two-dimensional Schrödinger equation for different potentials.
        - Analyzed energy levels and wave functions and visualized the resulting quantum states.
    - title: The 1999 Odisha Tropical Cyclone
      org: ATMO 436A, University of Arizona
      detail: "Collaborator: G. Fabian"
      date: May 2023
      link: https://doi.org/10.13140/RG.2.2.32826.98242
      bullets:
        - Examined the cyclone’s formation, intensity, and contributing meteorological factors, alongside its effects on human life, the environment, and agriculture.
        - "Project report: doi:10.13140/RG.2.2.32826.98242."

